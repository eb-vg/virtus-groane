<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina Non Trovata | Virtus Groane ASD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            margin-top: 100px;
        }
        .error-code {
            font-family: var(--font-title, 'Barlow Condensed', sans-serif);
            font-size: 6rem;
            font-weight: 700;
            color: #d9534f;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-family: var(--font-title, 'Barlow Condensed', sans-serif);
            font-size: 2rem;
            margin: 1rem 0;
            text-transform: uppercase;
        }
        .error-text {
            max-width: 500px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #555;
        }
        .btn-home {
            display: inline-block;
            background-color: #004b87;
            color: #fff;
            padding: 12px 28px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-family: var(--font-title, 'Barlow Condensed', sans-serif);
            font-size: 1.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn-home:hover {
            background-color: #003366;
        }
    </style>
</head>
<body>

    <!-- HEADER / NAVIGATION -->
    <header>
        <div class="container nav-container">
            <a href="/index.html" class="logo-link">
                <img src="/logo.png" alt="Virtus Groane ASD" class="logo-img">
            </a>
        </div>
    </header>

    <main class="error-container container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Pagina Non Trovata</h2>
        <p class="error-text">La pagina o la risorsa richiesta non esiste o è stata rimossa.</p>
        <a href="/index.html" class="btn-home">Torna alla Home Page</a>
    </main>

</body>
</html>
